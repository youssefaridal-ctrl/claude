name: Android Build

# Runs on every push and PR to produce a debug APK.
# Artifacts are uploaded and kept for 30 days.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Java 17 is required by the React Native Gradle plugin (jvmToolchain(17))
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_MIN_SDK: '24'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Verify JS — fast feedback before triggering the expensive native build
  # ─────────────────────────────────────────────────────────────────────────────
  verify-js:
    name: TypeScript & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Biome lint
        run: npx biome check src/ app/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build debug APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: verify-js

    steps:
      - uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ── Java 17 ──────────────────────────────────────────────────────────────
      # React Native's Gradle plugin (0.76.x) specifies jvmToolchain(17).
      # Temurin provides a reliable, freely-licensed OpenJDK distribution.
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # ── Android SDK ──────────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          sdkmanager \
            "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "platform-tools"

      # ── JS dependencies ──────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── Generate android/ directory ──────────────────────────────────────────
      # The android/ directory is gitignored; expo prebuild generates it from
      # app.json + installed packages. --clean ensures a reproducible output.
      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      # ── Gradle ───────────────────────────────────────────────────────────────
      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── Verify Gradle configuration ──────────────────────────────────────────
      - name: Verify Gradle wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Verify Android SDK compatibility
        working-directory: android
        run: |
          ./gradlew :app:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            --quiet \
            2>/dev/null | head -30 || true

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -XX:MaxMetaspaceSize=512m
            -Dfile.encoding=UTF-8

      # ── Report ────────────────────────────────────────────────────────────────
      - name: Verify APK and report size
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ APK not found at expected path: $APK"
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          {
            echo "## 📦 Debug APK — Build #${{ github.run_number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Size** | $SIZE |"
            echo "| **Variant** | debug |"
            echo "| **Signing** | debug keystore |"
            echo "| **Min SDK** | ${{ env.ANDROID_MIN_SDK }} (Android 7.0+) |"
            echo "| **Target SDK** | 34 (Android 14) |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Debug APK built successfully ($SIZE)"

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-bag-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-debug-${{ github.run_number }}
          path: |
            android/build/reports/
            android/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
